<body>
<div class="consent">
  <div class="card">
    <div class="logo-language-wrapper">
      <div class="language-selector">
        <select id="languageDropdown">
          <option value="english">English</option><option value="marathi">Marathi</option><option value="hindi">Hindi</option>
        </select>
      </div>

      <div class="logo-container center">
        <img src="https://sdpqa-hs.qhtpl.com/cpm-api/upload/v1/fileDownloads?fileUrl=hdfs://sdp-hdfs-namenode.hdfs.svc.cluster.local:9820/jars/1753812728744_Logo.jpg" class="logo">
        <span class="company-name" data-translate="companyName">Quick Heal</span>
      </div>
    </div>

    <!-- Permissions -->
    <div id="permissions">
      
          <div class="permission-block">
            <p data-translate-text="68891013c1571b72b5ff00a1"><p>1) Gender:</p> <span class="mandatory">*</span></p>
            
            <label class="radio-label">
              <input type="radio" name="68891013c1571b72b5ff00a1" value="Male" data-translate-option="68891013c1571b72b5ff00a1"> Male
            </label>
          
            <label class="radio-label">
              <input type="radio" name="68891013c1571b72b5ff00a1" value="Female" data-translate-option="68891013c1571b72b5ff00a1"> Female
            </label>
          
            <label class="radio-label">
              <input type="radio" name="68891013c1571b72b5ff00a1" value="Other" data-translate-option="68891013c1571b72b5ff00a1"> Other
            </label>
          
          </div>
        
          <div class="permission-block">
            <p data-translate-text="68891013c1571b72b5ff00a2"><p>2) Marital Status:</p></p>
            
            <label class="checkbox-label">
              <input type="checkbox" name="68891013c1571b72b5ff00a2" value="Single" data-translate-option="68891013c1571b72b5ff00a2"> Single
            </label>
          
            <label class="checkbox-label">
              <input type="checkbox" name="68891013c1571b72b5ff00a2" value="Married" data-translate-option="68891013c1571b72b5ff00a2"> Married
            </label>
          
            <label class="checkbox-label">
              <input type="checkbox" name="68891013c1571b72b5ff00a2" value="Divorced" data-translate-option="68891013c1571b72b5ff00a2"> Divorced
            </label>
          
            <label class="checkbox-label">
              <input type="checkbox" name="68891013c1571b72b5ff00a2" value="Widowed" data-translate-option="68891013c1571b72b5ff00a2"> Widowed
            </label>
          
            <label class="checkbox-label">
              <input type="checkbox" name="68891013c1571b72b5ff00a2" value="Seperated" data-translate-option="68891013c1571b72b5ff00a2"> Seperated
            </label>
          
            <label class="checkbox-label">
              <input type="checkbox" name="68891013c1571b72b5ff00a2" value="Other" data-translate-option="68891013c1571b72b5ff00a2"> Other
            </label>
          
          </div>
        
          <div class="permission-block">
            <p data-translate-text="68891013c1571b72b5ff00a3"><p>3) Is the patient under 18 years old?</p></p>

          </div>
        
    </div>

    <div id="error-message" class="error-message"></div>

     <div id="toast" style="
      visibility: hidden;
      min-width: 175px;

    "></div>


    <!-- Buttons -->
    <div class="button-group">
<button type="button" class="cancel" data-translate="cancelBtn"
  >
  Cancel
</button>
 
<button type="submit" class="submit" id="submitButton" data-translate="submitBtn"
  >
  Submit
</button>
</div>

  </div>
</div>
  <script>
    // ─────────────────────────────────────────────────────────────
    // Cookie helper — sets cookies with explicit SameSite + path
    // so they appear in DevTools → Application → Cookies
    // and in DevTools → Network → Request Headers (Cookie:)
    // ─────────────────────────────────────────────────────────────
    function setCookie(name, value, days, sameSite = 'Lax') {
      const expires = new Date(Date.now() + days * 864e5).toUTCString();
      document.cookie =
        `${name}=${value}; expires=${expires}; path=/; SameSite=${sameSite}`;
    }

    // ── Necessary ─────────────────────────────────────────────
    setCookie('PHPSESSID',      'qh_sess_abc123xyz789',        1);
    setCookie('csrf_token',     'qh_csrf_tok9f2a8b3c1d',       1);

    // ── Functional ────────────────────────────────────────────
    setCookie('lang_pref',      'en-IN',                     365);
    setCookie('ui_theme',       'light',                     365);

    // ── Analytics ─────────────────────────────────────────────
    // Realistic GA4 values: GA1.<domains>.<clientId> format
    setCookie('_ga',            'GA1.2.847392810.1720000000', 730);
    setCookie('_ga_0000000001', 'GS1.1.1720000000.1.1.1720000060.0.0.0', 730);
    setCookie('_hjid',          'a1b2c3d4-e5f6-7890-abcd-ef1234567890', 365);

    // ── Marketing ─────────────────────────────────────────────
    // Realistic fbp/gcl format
    setCookie('_fbp',           'fb.1.1720000000000.847392810', 90);
    setCookie('_gcl_au',        '1.1.1234567890.1720000000',    90);

    // ── Others ────────────────────────────────────────────────
    setCookie('sp_t',           'qh_unclassified_sp001',        30);

    // ─────────────────────────────────────────────────────────────
    // Ping a real endpoint with credentials: 'include' so all
    // cookies above appear in the Network tab → Request Headers
    // under the "Cookie:" header.
    // httpbin.org/cookies echoes back the cookies it received —
    // visible in Network → Response as JSON too.
    // ─────────────────────────────────────────────────────────────
    window.addEventListener('load', () => {
      fetch('https://httpbin.org/cookies', {
        method: 'GET',
        credentials: 'include',   // sends Cookie: header → visible in Network tab
        mode: 'cors'
      })
      .then(r => r.json())
      .then(data => {
        console.log('[Cookie ping] Cookies seen by server:', data.cookies);
      })
      .catch(() => {
        // CORS may block the response body on some browsers —
        // the outgoing Cookie: header is still visible in Network tab
        console.log('[Cookie ping] Request sent — check Network tab → Cookie header');
      });
    });
  </script>

</body>
</html>
